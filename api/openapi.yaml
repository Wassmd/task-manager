openapi: 3.1.0
info:
  title: Task Manager API
  version: 1.0.0

servers:
  - url: '/'

tags:
  - name: Tasks
  - name: TaskWatchers
  - name: Users

paths:
  /api/v1/task-watcher:
    post:
      tags:
        - TaskWatchers
      summary: Add a watcher to a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskWatcher'
      responses:
        '201':
          description: Task watcher added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskWatcher'
        '404':
          description: Task not found
        '409':
          description: Watcher already exists for this task

  /api/v1/tasks:
    get:
      tags:
        - Tasks
      summary: Get all tasks from Api first yaml
      responses:
        '200':
          description: A list of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
    post:
      tags:
        - Tasks
      summary: Create a new task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'

  /api/v1/users:
    get:
      tags:
        - Users
      summary: Get all users
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      tags:
        - Users
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /api/v1/users/{userId}:
    get:
      tags:
        - Users
      summary: Get a user by id
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The requested user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
    delete:
      tags:
        - Users
      summary: Deactivate a user (soft delete)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User deactivated successfully
        '404':
          description: User not found

components:
  schemas:
    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        dueDate:
          type: string
          format: date
        userId:
          type: string
          format: uuid
        user:
          $ref: "#/components/schemas/User"
          readOnly: true
        watchers:
          type: array
          items:
            $ref: "#/components/schemas/TaskWatcher"
      required:
        - title
        - status
        - userId

    TaskStatus:
      type: string
      enum:
        - OPEN
        - IN_PROGRESS
        - DONE

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        active:
          type: boolean
          readOnly: true
      required:
        - firstName
        - lastName
        - email

    TaskWatcher:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        taskId:
          type: string
          format: uuid
        emailId:
          type: string
          format: email
      required:
        - taskId
        - emailId