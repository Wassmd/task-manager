openapi: 3.1.0
info:
  title: Task Manager API
  version: 1.0.0

servers:
  - url: '/api'

tags:
  - name: Tasks

paths:
  /tasks:
    get:
      tags:
        - Tasks
      summary: Get all tasks
      responses:
        '200':
          description: A list of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
    post:
      tags:
        - Tasks
      summary: Create a new task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
  
components:
  schemas:
    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        dueDate:
          type: string
          format: date
      required:
        - [id, title, status, createdAt]

    TaskStatus:
      type: string
      enum:
        - OPEN
        - IN_PROGRESS
        - DONE