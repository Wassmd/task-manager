spring:
  application:
    name: task-manager-service

  datasource:
    url: jdbc:postgresql://localhost:5432/task-manager-db
    username: username
    password: password
  jpa:
    open-in-view: false
    show-sql: true
logging:
  level:
    org:
      hibernate:
        SQL: DEBUG

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger
    url: /openapi.yaml
